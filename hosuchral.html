<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сэвлэг үргээх ёслолын урилга</title>
    <style>
        . {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: aqua;
            color: navy;
            font-family: Georgia, serif;

        }

        button {
            font-family: inherit;
        }

        .huudasniiorgon {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            overflow: hidden;
            background: radial-gradient(circle at 10% 20%, #fffdf8, 0, transparent 40%),
                linear-gradient(180deg, #f9f2e8, #f3e7d8);

        }

        .ehniiheseg {
            position: relative;
            min-height: 850px;
            padding: 60px 20px 45px;
            text-align: center;
            overflow: hidden;
            background: radial gradient(circle at 0% 30%, #ffffff 0, transparent 35%),
                radial-gradient(circle at 100% 70%, #e4d8c7 0, transparent 35%);
        }

        .jijiggarchig {
            font-size: 10px;
            letter-spacing: 3px;
            color: blue;
        }

        .mongol {
            margin: 12px auto;
            font-size: 35px;
            color: blue;
        }


        .ehniiheseg h1 {
            margin: 12px 0 0;
            font-family: Georgia, serif;
            font-size: clamp(34px, 6vw, 57px);
            font-style: italic;
            font-weight: 400;
        }

        .welcome {
            margin: 12px 0 0;
            color: #87786b;
            font-size: 12px;
        }

        .dugtuiniibairlal {
            display: flex;
            justify-content: center;
            perspective: 1200px;
            padding: 0 12px;
        }

        .dugtui {
            position: absolute;
            isolation: isolate;
            width: min(86vw, 470px);
            height: 290px;
            margin-top: 115px;
            background: navy;
            border-radius: 5px;
            box-shadow: 0 25px 35px #263b5230,
                0 4px 10px #263b5215;
        }

        .dugtuiniiariinheseg {
            position: absolute;
            inset: 0;
            z-index: 0;
            border-radius: 5px;
            background: repeating-linear-gradient(45deg,
                    transparent 0 9px,
                    #ffffff09 9px 10px),
                linear-gradient(135deg, #496588, #2e4666);
        }

        .urilgiindotorcard {
            position: absolute;
            z-index: 2;
            left: 8%;
            bottom: 10px;
            width: 84%;
            height: 390px;
            padding: 9px;
            background: var(--paper);
            box-shadow: 0 5px 18px #293c5220;
            transition: transform 1.2s ease,
                bottom 1.2s ease;
        }

        .cardniihuree {
            position: relative;
            height: 100%;
            padding: 17px 12px;
            border: 2px solid #d8c5a8;
            outline: 1px dashed #a9b2bd;
            outline-offset: -7px;
            background: radial-gradient(circle at 0 0,
                    #e7edf4 0,
                    transparent 25%),
                var(--paper);
        }

        .cardniihuree::before,
        .cardniihuree::before {
            content: "";
            position: absolute;
            color: var(--blue);
            font-size: 21px;
            opacity: 0.75;
        }

        .cardniihuree::before {
            top: 5px;
            left: 10px;
        }

        .cardniihuree::after {
            right: 10px;
            bottom: 5px;
        }

        .cardniibichwer {
            margin: 3px 0 8px;
            font-size: 9px;
            letter-spacing: 2px;
        }

        .chimeglel {
            margin: 4px;
            color: var(--gold);
            font-size: 24px;
        }

        .cardniihuree h2 {
            margin: 0;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: clamp(25px, 5vw, 36px);
            font-weight: 400;
            font-style: italic;
        }

        .cardniihuree h3 {
            margin: 4px, 0;
            font-size: 10px;
            letter-spacing: 2px;
            font-weight: 400;
        }

        .divider {
            /*Tusgaarlagch*/
            margin: 8px auto;
            color: var(--gold);

        }

        .cardniibichwer {
            max-width: 300px;
            margin: 8px auto;
            font-size: 10px;
            line-height: 1.8;
            color: var(--text);
        }

        .huuhdiinner {
            margin: 9px auto;
            font-family: "Cormorant Garamond", Georgia, serif;
            font-size: 29px;
            font-style: italic;
            color: var(--blue);

        }

        .card-date,
        .card-time,
        .card-place {
            margin: 5px 0;
            font-size: 10px;
            color: var(--text);
        }

        .gerbuliinner {
            margin-top: 8px;
            font-size: 9px;
            font-styles: italic;
        }

        .bottom-ornament {
            font-size: 20px;
        }

        /*Dugtuinii hajuu*/
        .fold-left,
        .fold-right,
        .fold-bottom,

        .dugtuindeedhawtas {
            /*Dugtuin deed hawtas*/
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .fold-left {
            z-index: 3;
            background: linear-gradient(100deg, #496687, #354e70);
            clip-path: polygon(0 0, 54% 50%, 0 100%);
        }

        .fold-right {
            z-index: 3;
            background: linear-gradient(260deg, #2d4564, #3d587b);
            clip-path: polygon(100% 0, 46% 50%, 100% 100%);
        }

        .fold-bottom {
            z-index: 4;
            background: linear-gradient(0deg, #2c4565, #405d80);
            clip-path: polygon(0 100%, 50% 43%, 100% 100%);
        }

        .dugtuiniideedhawtas {
            z-index: 6;
            background: repeating-linear-gradient(135deg,
                    transparent 0 10px,
                    #ffffff08 10px 11px),
                linear-gradient(145deg,
                    #4c698c,
                    #304968);
            clip-path: polygon(0 0, 100% 0, 50% 65%);
            transform-orign: top center;
            transition: transform 0.85s case;
            backface-visibility: hidden;
        }

        /*Dugtuinii tor*/
        .dugtuiniitor {
            content: "";
            position: absolute;
            z-index: 5;
            left: 2%;
            top: 5%;
            width: 96%;
            height: 90%;
            border: 1px solid #d8c4ac;
            pointer-events: none;
            opacity: 0.75;
        }

        .lats {
            position: absolute;
            z-index: 7;
            top: 52%;
            left: 50%;
            width: 56px;
            height: 56px;
            display: grid;
            place-items: center;
            transform: translate(-50%, -50%);
            border: 3px double #d4bd96;
            border-radius: 50%;
            background: radial-gradient(circe, #6f8eae, #304968);
            box-shadow: 0 3px 8px #192b4050;
            color: #f8e9ca;
            font-size: 27px;
            transition: opacity 0.3s;

        }

        .dugtuigneehuyd {
            transform: rotateX(180deg);
            z-index: 1;
        }
    </style>
</head>

<body>
    <main class="website">
        <!--ЭХНИЙ ХЭСЭГ:ДУГТУЙ-->
        <section class="ehniiheseg">
            <p class="jijiggarchig">ХАЙР ДҮҮРЭН БАЯРТ ӨДӨР</p>
            <div class="mongol"></div>
            <h1> Сэвлэг үргээх ёслол</h1>
            <p class="welcome">Эрхэм хүндэт таныг урьж байна</p>
            <!--Дугтуйн зураглал-->
            <div class="dugtuiniibairlal">
                <div class="dugtui" id="dugtui">
                    <!--Дугтуйн арын хэсэг -->
                    <div class="dugtuiniiariinheseg"> </div>
                    <article class="urilgiindotorcard">
                        <div class="cardniihuree">
                            <p class="cardniibichwer">ХҮНДЭТ ЗОЧИН ТАНАА</p>
                            <div class="chimeglel"> </div>
                            <h2>Сэвлэг үргээх</h2>
                            <h3> ЁСЛОЛЫН УРИЛГА</h3>
                            <div class="divider"> y</div>
                            <p class="cardniibichwer">Сэвлэг үргээх баярт мөчийг хамтдаа тэмдэглэхээр эрхэм таныг
                                хүрэлцэн ирэхийг урьж байна</p>
                            <p class="huuhdiinner"> болд</p>
                            <p class="card-date">Огноо</p>
                            <p class="card-time">Цаг</p>
                            <p class="card-place">Газар</p>
                            <div class=></div>"
                            <div class="ornament bottom-ornament"> y</div>
                            <p class="gerbuliinner"> Гэр бүл</p>
                        </div>
                        <!--Dugtuinii hajuu-->
                        <div class="fold-left"></div>
                        <div class="fold-right"></div>
                        <div class="fold-bottom"></div>
                        <!--Dugtuinii deed hawtas-->
                        <div class="dugtuiniideedhawtas"></div>
                        <div class="lats"> <span> mongolbichig</span></div>



</body>

</html>
